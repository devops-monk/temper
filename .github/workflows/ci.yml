name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build

  engine:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run: { working-directory: engine }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --extra dev pytest -q
      # The same checks as Settings → Diagnostics; exits 1 if any of them fails on a clean runner.
      - run: uv run --extra dev temper-engine doctor

  shell:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev patchelf
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      # generate_context! embeds the built UI, so dist/ must exist before cargo runs.
      - run: npm run build
      - run: cargo build --locked
        working-directory: src-tauri
      # Settings → About → Open-source licences reads src/licenses.json; regenerate it with
      # `npm run licenses` after changing Rust or npm dependencies.
      - name: Licence list is up to date
        if: runner.os == 'Linux'
        run: npm run licenses && git diff --exit-code src/licenses.json
      # Headless first-run setup: downloads the pinned uv (checksum-verified), a managed Python and
      # the engine's locked packages, exactly as a new user's first launch does.
      - name: First-run setup (chat profile)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y xvfb
            xvfb-run -a ./src-tauri/target/debug/temper --setup chat
          else
            ./src-tauri/target/debug/temper --setup chat
          fi
