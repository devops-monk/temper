name: Release

# Push a tag like v0.1.0 to build installers for every platform into a draft GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, label: macOS Apple Silicon }
          - { os: macos-latest, target: x86_64-apple-darwin, label: macOS Intel }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, label: Windows x64 }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, label: Windows ARM64 }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, label: Linux x64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, label: Linux ARM64 }
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing (PLAN.md 0.10): add APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
          # APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID here once the
          # secrets exist. Until then builds are unsigned.
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Temper ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: Download the installer for your system below.
          releaseDraft: true
          args: --target ${{ matrix.target }}
