name: Release

# Push a tag like v0.1.0 to build installers for every platform and publish them as a GitHub release.
# The release stays a draft until every platform has built; re-run failed jobs to finish it.
# Running the workflow by hand builds the installers as workflow artifacts without releasing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the app version
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for v in "$(jq -r .version package.json)" "$(jq -r .version src-tauri/tauri.conf.json)" \
                   "$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)"; do
            if [ "$v" != "$tag" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $v in package.json, tauri.conf.json or Cargo.toml"
              exit 1
            fi
          done
      - name: Create the draft release
        id: draft
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            prerelease=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease || true)
            gh release create "$GITHUB_REF_NAME" --draft ${prerelease:+"$prerelease"} --verify-tag \
              --title "Temper $GITHUB_REF_NAME" --notes-file .github/release-notes.md --generate-notes
          fi
          echo "release_id=$(gh release view "$GITHUB_REF_NAME" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, label: macOS Apple Silicon }
          - { os: macos-latest, target: x86_64-apple-darwin, label: macOS Intel }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, label: Windows x64 }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, label: Windows ARM64 }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, label: Linux x64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, label: Linux ARM64 }
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev patchelf rpm
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri, key: "${{ matrix.target }}" }
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles that installed copies download (latest.json). The matching
          # public key is `plugins.updater.pubkey` in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Code signing (PLAN.md 0.10): add APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
          # APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID here once the
          # secrets exist. Until then builds are unsigned.
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: --target ${{ matrix.target }}
      - name: Keep the installers (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: temper-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

  # Installing through the website's install scripts is part of the release check.
  install-scripts:
    needs: publish
    uses: ./.github/workflows/installers.yml
