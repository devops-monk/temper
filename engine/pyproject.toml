[project]
name = "temper-engine"
version = "0.1.0"
description = "Local engine for the Temper desktop app: hardware probe, model hub, inference, training and export."
license = "Apache-2.0"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "psutil>=6.0",
  "huggingface_hub>=0.26",
  "packaging>=23",
  "pypdf>=5",
  # Renders scanned PDF pages for OCR.
  "pypdfium2>=4.30",
  # Knowledge bases: passage vectors and their similarity.
  "numpy>=1.26",
  # .gitignore rules, which knowledge bases honour.
  "pathspec>=0.12",
  # Transcripts of YouTube videos, for read_web_page and knowledge bases.
  "youtube-transcript-api>=1.2",
  # Windows has no time-zone database of its own; zoneinfo reads this one (the clock tool).
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Apple Silicon training through MLX.
mlx = ["mlx-lm>=0.20", "datasets>=3.0"]
dev = ["pytest>=8"]

[project.scripts]
temper-engine = "temper_engine.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
