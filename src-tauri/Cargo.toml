[package]
name = "temper"
version = "0.1.0"
description = "Run, fine-tune and ship local AI models"
authors = ["devops-monk"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "temper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
ureq = "3"
flate2 = "1.1.10"
tar = "0.4.46"
sha2 = "0.10.9"
hex = "0.4.3"
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }
fs4 = "1.1.0"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
# temper:// links and "Open with Temper"; a second launch hands its file or link to the running app.
tauri-plugin-deep-link = "2.6.2"
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

# rust-ini 0.21.2 added fields to ParseOption, which the deep-link plugin builds on Linux; hold it back until the plugin catches up.
[target.'cfg(target_os = "linux")'.dependencies]
rust-ini = "=0.21.1"
